name: Create native desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Verify release tag matches Gradle version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gradle_version="$(gradle --quiet printProjectVersion --no-daemon --no-configuration-cache)"
          expected_tag="v${gradle_version}"
          test "$RELEASE_TAG" = "$expected_tag" || {
            echo "Release tag must be $expected_tag, but was $RELEASE_TAG."
            exit 1
          }

      - name: Run quality gates
        run: xvfb-run -a gradle ktlintCheck check test --no-daemon --no-configuration-cache

  package:
    name: Package ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-deb
            runner: ubuntu-latest
            task: packageLinuxDeb
            extension: deb
            install_rpm: false
          - platform: linux-rpm
            runner: ubuntu-latest
            task: packageLinuxRpm
            extension: rpm
            install_rpm: true
          - platform: macos-arm64
            runner: macos-latest
            task: packageDmg
            extension: dmg
            install_rpm: false
          - platform: macos-x64
            runner: macos-15-intel
            task: packageDmg
            extension: dmg
            install_rpm: false
          - platform: windows
            runner: windows-latest
            task: packageMsi
            extension: msi
            install_rpm: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Install RPM packaging tools
        if: matrix.install_rpm
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Build native package
        run: gradle :desktop:${{ matrix.task }} --no-daemon --no-configuration-cache
        shell: bash

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find modules/desktop/build/compose/binaries -type f -name '*.${{ matrix.extension }}' -print -quit)"
          test -n "$package_file"
          mkdir release-assets
          cp "$package_file" "release-assets/visual-agent-${{ matrix.platform }}.${{ matrix.extension }}"

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: visual-agent-${{ matrix.platform }}
          if-no-files-found: error
          path: release-assets/

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download native packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes
          fi
