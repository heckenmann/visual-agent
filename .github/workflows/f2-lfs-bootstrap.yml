name: Prepare F2 icon LFS objects

on:
  push:
    branches:
      - codex/issue-476-f2-logo
    paths:
      - .github/workflows/f2-lfs-bootstrap.yml

permissions:
  contents: write

jobs:
  upload-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the preparation commit
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Install icon renderers
        run: sudo apt-get update && sudo apt-get install -y inkscape python3-pil

      - name: Render the selected F2 artwork
        run: /usr/bin/python3 scripts/generate-app-icons.py

      - name: Upload generated objects to Git LFS
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs track '*.icns'
          git add \
            modules/ui/src/main/resources/icons/visual-agent.png \
            modules/desktop/src/main/composeResources/drawable/visual_agent.png \
            modules/desktop/packaging/icons/visual-agent.ico \
            modules/desktop/packaging/icons/visual-agent.icns
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          paths = [
              'modules/ui/src/main/resources/icons/visual-agent.png',
              'modules/desktop/src/main/composeResources/drawable/visual_agent.png',
              'modules/desktop/packaging/icons/visual-agent.ico',
              'modules/desktop/packaging/icons/visual-agent.icns',
          ]
          entries = []
          for path in paths:
              data = Path(path).read_bytes()
              pointer = subprocess.check_output(['git', 'show', ':' + path]).decode()
              oid = hashlib.sha256(data).hexdigest()
              assert 'oid sha256:' + oid in pointer
              assert 'size ' + str(len(data)) in pointer
              entries.append({'path': path, 'pointer': pointer, 'oid': oid, 'size': len(data)})
          subprocess.run(
              ['git', 'lfs', 'push', '--object-id', 'origin', *sorted({entry['oid'] for entry in entries})],
              check=True,
          )
          manifest = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'entries': entries}
          Path('f2-lfs-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('F2_LFS_MANIFEST=' + json.dumps(manifest, separators=(',', ':')))
          PY

      - name: Retain the generated icon bytes and pointers
        uses: actions/upload-artifact@v7
        with:
          name: f2-icons-lfs
          retention-days: 7
          if-no-files-found: error
          path: |
            f2-lfs-manifest.json
            modules/ui/src/main/resources/icons/visual-agent.png
            modules/desktop/src/main/composeResources/drawable/visual_agent.png
            modules/desktop/packaging/icons/visual-agent.ico
            modules/desktop/packaging/icons/visual-agent.icns
