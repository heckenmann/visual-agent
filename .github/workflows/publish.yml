name: Publish master JAR to GitHub Packages

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  publish:
    name: Build and publish ${{ matrix.platform }} master JAR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-latest
            platform: macos-arm64
          - runner: windows-latest
            platform: windows
    env:
      VISUAL_AGENT_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.0 --no-daemon

      - name: Build JAR without tests
        run: ./gradlew --no-daemon :ui:bootJar
        shell: bash

      - name: Publish to GitHub Packages
        run: ./gradlew --no-daemon :ui:publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
