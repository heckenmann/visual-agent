name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  NO_AT_BRIDGE: "1"
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "24"

      - name: Read Gradle wrapper version
        id: gradle_wrapper
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-[^/]*\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ steps.gradle_wrapper.outputs.version }}
          cache-read-only: false
          cache-cleanup: on-success
          cache-overwrite-existing: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version "${{ steps.gradle_wrapper.outputs.version }}"

      - name: Validate generated Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Run tests
        run: xvfb-run -a ./gradlew ktlintCheck check test --build-cache --no-daemon --no-configuration-cache -PdatabaseTestMaxParallelForks=4

      - name: Verify executable JARs can launch
        shell: bash
        run: |
          set -euo pipefail

          verify_launch() {
            local jar_path="$1"
            local require_spring_startup="${2:-true}"
            local log_path
            local status=0
            log_path="$(mktemp)"

            # The desktop JAR needs a deterministic renderer in the virtual display used by CI.
            # Skiko's software renderer is supported by Compose Desktop and avoids relying on
            # whichever OpenGL provider happens to be installed on the GitHub runner.
            timeout --kill-after=10s 25s xvfb-run -a java -Dskiko.renderApi=SOFTWARE -jar "$jar_path" \
              --spring.main.web-application-type=none >"$log_path" 2>&1 || status=$?

            if [[ "$require_spring_startup" == "true" ]]; then
              if ! grep -Eq "Started .+ in [0-9]+(\\.[0-9]+)? seconds" "$log_path"; then
                cat "$log_path"
                echo "JAR did not reach Spring Boot startup: $jar_path"
                exit 1
              fi
            else
              # The desktop entry point intentionally waits on its interactive splash and
              # therefore cannot reach Spring's startup log without a user selection.
              case "$status" in
                124|137) ;;
                *)
                  cat "$log_path"
                  echo "Desktop JAR exited before the splash remained available: $jar_path"
                  exit 1
                  ;;
              esac
              return
            fi

            case "$status" in
              0|124|137) ;;
              *)
                cat "$log_path"
                echo "JAR exited before the launch check completed (status $status): $jar_path"
                exit 1
                ;;
            esac
          }

          application_jar="$(find application/build/libs -maxdepth 1 -type f -name 'application-*.jar' ! -name '*-plain.jar' -print -quit)"
          desktop_jar="$(find modules/desktop/build/libs -maxdepth 1 -type f -name 'desktop-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$application_jar"
          test -n "$desktop_jar"
          verify_launch "$application_jar"
          verify_launch "$desktop_jar" false
