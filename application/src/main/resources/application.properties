spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# The Codex agent wrapper logs the complete goal at INFO; its process runner
# logs full command arguments at DEBUG. Both contain conversation history.
logging.level.org.springaicommunity=WARN
logging.level.org.zeroturnaround=WARN
