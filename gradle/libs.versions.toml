junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-ui-test-junit4-desktop = { module = "org.jetbrains.compose.ui:ui-test-junit4-desktop", version.ref = "compose" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
infinite-canvas = { module = "io.github.xingray:compose-infinite-canvas-core", version.ref = "infinite-canvas" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
