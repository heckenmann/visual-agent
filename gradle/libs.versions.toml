[versions]
visual-agent = "0.1.0"
kotlin = "2.4.10"
ktlint = "14.2.0"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
spring-ai = "2.0.0"
spring-integration = "7.1.0"
compose = "1.11.1"
compose-material3 = "1.9.0"
compose-material-icons = "1.7.3"
sqlite = "3.53.2.1"
coroutines = "1.11.0"
serialization = "1.11.0"
pdfbox = "3.0.8"
tika = "3.3.2"
okhttp = "5.5.0"
commons-net = "3.13.0"
mina-sshd = "2.18.0"
kotlin-logging = "3.0.5"
logback = "1.6.3"
mockk = "1.14.11"
junit = "6.1.3"
reorderable = "3.1.0"
infinite-canvas = "0.2.0"
